<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SA1 · Sesión 1 · Las funciones vitales</title>
<style>
:root{
 --bg:#f4fbf4;--card:#fff;--ink:#183422;--muted:#6b786e;--line:#d4e7d7;
 --green:#2f8f46;--green2:#1f6b33;--soft:#edf8ef;--ok:#15783b;--bad:#b42318;
 --gold:#d8a11b;--teacher:#fff7d3;
}
*{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(#f7fcf7,#eff8f1);color:var(--ink)}
header{position:sticky;top:0;z-index:20;background:#fffffff0;border-bottom:1px solid var(--line);box-shadow:0 4px 18px #1f6b3312}
.top{max-width:1280px;margin:auto;padding:10px 14px;display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.brand{font-size:20px;font-weight:900;color:var(--green2)} .brand:before{content:"🌿 "}
nav{display:flex;gap:6px;flex-wrap:wrap} button{font:inherit}
nav button,.btn{border:0;border-radius:13px;padding:10px 13px;font-weight:800;cursor:pointer;transition:.18s}
nav button{background:var(--soft);color:var(--green2);border:1px solid #cce5d1}
nav button.active{background:linear-gradient(135deg,var(--green),var(--green2));color:white}
.score{font-weight:900;background:#eef8e9;padding:8px 11px;border-radius:999px}
.lang{display:flex;gap:5px;padding:5px;background:white;border:1px solid var(--line);border-radius:14px}
.lang button{border:0;border-radius:10px;padding:8px 10px;font-weight:900;cursor:pointer;background:#edf8ef;color:var(--green2)}
.lang button.active{background:var(--green2);color:white}
.font-control{display:flex;gap:4px;padding:5px;background:white;border:1px solid var(--line);border-radius:14px}
.font-control button{border:0;border-radius:10px;padding:8px 10px;font-weight:900;cursor:pointer;background:#edf8ef;color:var(--green2)}
.font-control button.active{background:var(--green2);color:white}
body.font-small{font-size:15px}
body.font-medium{font-size:23px}
body.font-large{font-size:32px}
body.font-small p,body.font-small li{font-size:1em}
body.font-medium p,body.font-medium li{font-size:1.12em}
body.font-large p,body.font-large li{font-size:1.25em}
body.font-medium .question{font-size:38px}
body.font-large .question{font-size:52px}
body.font-medium h1{font-size:52px}
body.font-large h1{font-size:70px}
body.font-medium h2{font-size:40px}
body.font-large h2{font-size:56px}
body.font-medium h3{font-size:28px}
body.font-large h3{font-size:38px}
body.font-medium .btn.answer{font-size:24px}
body.font-large .btn.answer{font-size:32px}
body.font-medium .chip{font-size:25px}
body.font-large .chip{font-size:34px}
body.font-medium nav button{font-size:18px}
body.font-large nav button{font-size:22px}
.wrap{max-width:1220px;margin:20px auto;padding:0 16px 50px}
.screen{display:none} .screen.active{display:block;animation:fade .22s ease} @keyframes fade{from{opacity:.4;transform:translateY(5px)}to{opacity:1}}
.card{background:white;border:1px solid var(--line);border-radius:23px;padding:26px;margin-bottom:18px;box-shadow:0 10px 28px #1f6b3310}
.hero{text-align:center;padding:42px 32px;background:linear-gradient(135deg,#eef9ec,#fff)}
h1{font-size:42px;margin:.12em 0;color:var(--green2)} h2{font-size:31px;margin:.2em 0 .5em;color:var(--green2)} h3{color:#2a6539}
p,li{line-height:1.58} .muted{color:var(--muted)} .mini{font-size:13px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--green)}
.bigq{font-size:34px;font-weight:900;line-height:1.2;margin:24px auto;max-width:900px}
.actions,.chips,.sequence{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:16px 0}
.btn{background:linear-gradient(135deg,var(--green),var(--green2));color:white;font-size:17px;box-shadow:0 4px 10px #1f6b3320}
.btn:hover{transform:translateY(-2px)} .btn.secondary{background:var(--soft);color:var(--green2);border:1px solid #cce5d1;box-shadow:none}
.btn.answer{min-width:220px;font-size:19px} .btn.red{background:linear-gradient(135deg,#cf4a3f,#9f261d)} .btn.gold{background:linear-gradient(135deg,#e2b13c,#b9830b)}
.chip{background:#e8f5e7;border:1px solid #cbe3c9;border-radius:999px;padding:13px 18px;font-weight:900;font-size:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}
.info{background:linear-gradient(#fbfefb,#f0f8f2);border:1px solid var(--line);border-radius:17px;padding:18px}
.reveal{cursor:pointer} .reveal .detail{display:none;margin-top:10px} .reveal.open .detail{display:block}
.reveal:after{content:"▾";float:right;font-weight:900;color:var(--green)}
.imagebox{display:grid;grid-template-columns:1.05fr .95fr;gap:20px;align-items:center}
.imagebox img{width:100%;max-height:470px;object-fit:contain;border-radius:18px;border:1px solid var(--line);box-shadow:0 8px 18px #1f6b3315;background:white}
.teacher{background:var(--teacher);border:1px solid #ead987;border-radius:15px;padding:14px 16px;margin-top:14px}
.question{font-size:29px;font-weight:900;text-align:center;padding:20px 8px}
.feedback{min-height:35px;text-align:center;font-size:21px;font-weight:900;margin:10px 0}
.progress{height:11px;background:#e6efe7;border-radius:999px;overflow:hidden;margin:10px 0 20px} .bar{height:100%;background:linear-gradient(90deg,#76c873,var(--green));width:0}
.seq{background:#f0f8f2;border:2px solid #cce3d0;border-radius:13px;padding:12px 14px;font-weight:900}
.arrow{font-size:24px;font-weight:900;color:var(--green)}
.orderBox{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;min-height:72px;padding:12px;border:2px dashed #bdd6c1;border-radius:15px;background:#f9fcf9}
.orderBtn{border:1px solid #cce1cf;background:white;border-radius:12px;padding:11px 13px;font-weight:800;cursor:pointer}
.flash{height:210px;border:2px dashed #bdd6c1;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:58px;background:#fbfefb;transition:.15s} .flash.on{background:#f2f7a5}
.timer{font-size:50px;font-weight:900;text-align:center;color:var(--green2)} .result{font-size:31px;font-weight:900;text-align:center}
.hidden{display:none!important} .center{text-align:center}
@media(max-width:800px){.imagebox{grid-template-columns:1fr}h1{font-size:33px}.bigq{font-size:27px}.question{font-size:24px}}

body.font-medium .btn{font-size:20px;padding:12px 16px}
body.font-large .btn{font-size:27px;padding:15px 20px}
body.font-medium .feedback{font-size:25px}
body.font-large .feedback{font-size:34px}
body.font-medium .mini{font-size:16px}
body.font-large .mini{font-size:20px}
body.font-medium .info{font-size:20px}
body.font-large .info{font-size:27px}
body.font-large .teacher{font-size:27px}
body.font-medium .teacher{font-size:20px}


.decor-row{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:16px 0}
.decor-icon{width:72px;height:72px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:36px;background:linear-gradient(145deg,#fff,#eaf6ec);border:1px solid #cfe3d3;box-shadow:0 7px 18px rgba(31,107,51,.10)}
.visual-banner{background:linear-gradient(135deg,#e8f6e8,#f7fff2);border:1px solid #cde5d0;border-radius:20px;padding:15px 17px;margin:14px 0;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.visual-banner .emoji{font-size:42px}.visual-banner .txt{flex:1;min-width:220px}
.badge{display:inline-flex;align-items:center;gap:6px;background:#eff8ef;border:1px solid #cce4cf;color:#1f6b33;border-radius:999px;padding:7px 11px;font-weight:900;margin:3px}
.fun-note{background:#f3fbef;border-left:5px solid #71b95c;border-radius:14px;padding:13px 15px;margin:14px 0;font-weight:700}


/* Natural Science classroom background — high contrast */
body{
  background:
    linear-gradient(135deg,#0f4f2d 0%,#17663a 35%,#0d3f25 100%) !important;
  background-attachment:fixed !important;
  color:#17321f;
  overflow-x:hidden;
}

/* Moving leaf layers behind the content */
body::before,
body::after{
  position:fixed;
  inset:-15vh -10vw;
  z-index:-2;
  pointer-events:none;
  white-space:pre-wrap;
  overflow:hidden;
  line-height:1.8;
  transform-origin:center;
}

body::before{
  content:"🍃     🌿        🍃    🌱      🍃        🌿      🍃\A      🌿      🍃       🌱        🍃      🌿\A 🍃        🌱      🌿         🍃        🌱      🍃\A      🍃      🌿        🍃      🌱        🌿";
  font-size:54px;
  letter-spacing:30px;
  opacity:.12;
  filter:brightness(1.8) saturate(.7);
  animation:leafDrift1 28s linear infinite;
}

body::after{
  content:"🌿        🍃      🌱       🍃        🌿      🍃\A   🍃      🌱        🌿       🍃      🌱\A      🌿       🍃      🌱       🌿       🍃";
  font-size:42px;
  letter-spacing:42px;
  opacity:.075;
  filter:brightness(2) saturate(.55);
  animation:leafDrift2 38s linear infinite;
  z-index:-3;
}

@keyframes leafDrift1{
  0%{transform:translate3d(-2%,0,0) rotate(-3deg)}
  50%{transform:translate3d(3%,4%,0) rotate(2deg)}
  100%{transform:translate3d(-2%,0,0) rotate(-3deg)}
}
@keyframes leafDrift2{
  0%{transform:translate3d(2%,3%,0) rotate(3deg)}
  50%{transform:translate3d(-3%,-2%,0) rotate(-2deg)}
  100%{transform:translate3d(2%,3%,0) rotate(3deg)}
}

/* Dark-green science frame accents */
.wrap{
  position:relative;
}
.wrap::before{
  content:"SCIENCE • EXPLORE • DISCOVER • LEARN";
  display:block;
  text-align:center;
  margin:4px 0 18px;
  padding:10px 16px;
  border-radius:999px;
  font-weight:900;
  letter-spacing:.18em;
  font-size:12px;
  color:#eaffea;
  background:rgba(8,54,30,.72);
  border:1px solid rgba(214,255,216,.28);
  box-shadow:0 8px 24px rgba(0,0,0,.18);
}

/* Main content remains bright for clear classroom projection */
.card{
  background:rgba(255,255,255,.97) !important;
  backdrop-filter:blur(7px);
  border:1px solid rgba(210,235,214,.9) !important;
  box-shadow:0 14px 34px rgba(0,0,0,.22) !important;
}

.hero{
  background:linear-gradient(135deg,rgba(240,250,239,.98),rgba(255,255,255,.98)) !important;
}

header{
  background:rgba(246,252,247,.96) !important;
  backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(20,90,45,.22) !important;
  box-shadow:0 5px 20px rgba(0,0,0,.16) !important;
}

/* More contrast inside interactive elements */
.info{
  background:linear-gradient(180deg,#ffffff,#eef7ef) !important;
  border-color:#c8dfcd !important;
}
.teacher{
  box-shadow:0 5px 14px rgba(0,0,0,.08);
}
.imagebox img{
  border:2px solid #bdd8c2 !important;
  box-shadow:0 10px 22px rgba(0,0,0,.16) !important;
}

</style>
</head>

function wireDynamic(){
 if(current===3) renderNut();
 if(current===4) renderOrder();
 if(current===7) renderRel();
 if(current===9) renderTF();
 if(current===10) renderClass();
 if(current===11) renderSprint();
 if(current===12) renderExit();
}

function answerNut(a){if(nlock)return;nlock=true;const q=nutQs[LANG][ni];const ok=a===q[1],f=document.getElementById("nutF");f.textContent=ok?L().correct:(LANG==='es'?"❌ Es "+q[1]:"❌ It is "+q[1]);f.style.color=ok?"var(--ok)":"var(--bad)";if(ok)addScore()}
function renderNut(){nlock=false;document.getElementById("nutQ").textContent=nutQs[LANG][ni][0];document.getElementById("nutF").textContent=""}
function nextNut(){ni=(ni+1)%nutQs[LANG].length;renderNut()}
function shuffleNut(){nutQs[LANG].sort(()=>Math.random()-.5);ni=0;renderNut()}

function orderSteps(){
 return LANG==='es'?["Los alimentos entran en el aparato digestivo","El digestivo obtiene nutrientes","El respiratorio obtiene oxígeno","El circulatorio transporta nutrientes y oxígeno","El excretor elimina desechos"]:
 ["Food enters the digestive system","The digestive system obtains nutrients","The respiratory system obtains oxygen","The circulatory system transports nutrients and oxygen","The excretory system removes waste"];
}
function renderOrder(){const steps=orderSteps(),pool=document.getElementById("nutPool"),ord=document.getElementById("nutOrder");pool.innerHTML="";ord.innerHTML="";steps.forEach((x,i)=>{if(!chosen.includes(i)){const b=document.createElement("button");b.className="orderBtn";b.textContent=x;b.onclick=()=>{chosen.push(i);renderOrder()};pool.appendChild(b)}});chosen.forEach((i,p)=>{const b=document.createElement("button");b.className="orderBtn";b.textContent=(p+1)+". "+steps[i];b.onclick=()=>{chosen.splice(p,1);renderOrder()};ord.appendChild(b)})}
function resetOrder(){chosen=[];renderOrder();document.getElementById("orderF").textContent=""}
function checkOrder(){const ok=chosen.length===5&&chosen.every((v,i)=>v===i),f=document.getElementById("orderF");f.textContent=ok?L().correct:L().wrong;f.style.color=ok?"var(--ok)":"var(--bad)";if(ok)addScore()}

function beep(){try{const A=new (window.AudioContext||window.webkitAudioContext)(),o=A.createOscillator(),g=A.createGain();o.connect(g);g.connect(A.destination);o.frequency.value=520;g.gain.value=.12;o.start();setTimeout(()=>{o.stop();A.close()},400)}catch(e){}}
function quick(ok){const f=document.getElementById("quickF");f.textContent=ok?L().correct:L().wrong;f.style.color=ok?"var(--ok)":"var(--bad)";if(ok)addScore()}
function flashIt(){const b=document.getElementById("flashBox");b.classList.add("on");setTimeout(()=>b.classList.remove("on"),220)}

function renderRel(){const r=relQs[LANG][ri];document.getElementById("relQ").textContent=r.q;document.getElementById("relSeq").innerHTML=""}
function revealRel(){const r=relQs[LANG][ri],l=L();document.getElementById("relSeq").innerHTML=`<span class="seq">${r.s}</span><span class="arrow">→</span><span class="seq">${r.o}</span><span class="arrow">→</span><span class="seq">${l.nervousSystem}</span><span class="arrow">→</span><span class="seq">${l.locomotorSystem}</span><span class="arrow">→</span><span class="seq">${r.r}</span>`}
function nextRel(){ri=(ri+1)%relQs[LANG].length;renderRel()}

function renderTF(){tlock=false;document.getElementById("tfQ").textContent=tfQs[LANG][ti][0];document.getElementById("tfF").textContent=""}
function answerTF(v){if(tlock)return;tlock=true;const ok=v===tfQs[LANG][ti][1],f=document.getElementById("tfF");f.textContent=ok?L().correct:L().wrong;f.style.color=ok?"var(--ok)":"var(--bad)";if(ok)addScore()}
function nextTF(){ti=(ti+1)%tfQs[LANG].length;renderTF()}

function renderClass(){clock=false;document.getElementById("classQ").textContent=classQs[LANG][ci][0];document.getElementById("classF").textContent=""}
function answerClass(a){if(clock)return;clock=true;const ok=a===classQs[LANG][ci][1],f=document.getElementById("classF");f.textContent=ok?L().correct:L().wrong;f.style.color=ok?"var(--ok)":"var(--bad)";if(ok)addScore()}
function nextClass(){ci=(ci+1)%classQs[LANG].length;renderClass()}

function renderSprint(){document.getElementById("sprintQ").textContent=sprintOn?classQs[LANG][sprintIndex%classQs[LANG].length][0]:(LANG==='es'?"Pulsa START para comenzar":"Press START to begin")}
function startSprint(){if(sprintOn)return;sprintOn=true;sprintTime=60;sprintScore=0;sprintIndex=0;renderSprint();document.getElementById("timer").textContent=60;sprintTimer=setInterval(()=>{sprintTime--;document.getElementById("timer").textContent=sprintTime;if(sprintTime<=0){clearInterval(sprintTimer);sprintOn=false;document.getElementById("sprintQ").textContent=L().finished;document.getElementById("sprintResult").textContent=L().result+": "+sprintScore}},1000)}
function sprintAnswer(a){if(!sprintOn)return;if(a===classQs[LANG][sprintIndex%classQs[LANG].length][1]){sprintScore++;addScore()}sprintIndex++;renderSprint()}

function renderExit(){if(ei>=exitQs[LANG].length){document.getElementById("exitQ").textContent=L().finished;document.getElementById("exitA").innerHTML="";document.getElementById("exitF").textContent="";const r=document.getElementById("exitResult");r.classList.remove("hidden");r.innerHTML="<b>"+L().result+": "+ec+"/"+exitQs[LANG].length+"</b>";return}elock=false;const d=exitQs[LANG][ei];document.getElementById("exitQ").textContent=d.q;const box=document.getElementById("exitA");box.innerHTML="";d.a.forEach((x,i)=>{const b=document.createElement("button");b.className="btn answer";b.textContent=x;b.onclick=()=>answerExit(i);box.appendChild(b)});document.getElementById("exitF").textContent=""}
function answerExit(i){if(elock)return;elock=true;const d=exitQs[LANG][ei],ok=i===d.ok,f=document.getElementById("exitF");f.textContent=ok?L().correct:(LANG==='es'?"❌ Respuesta correcta: ":"❌ Correct answer: ")+d.a[d.ok];f.style.color=ok?"var(--ok)":"var(--bad)";if(ok){ec++;addScore()}}
function nextExit(){if(ei<exitQs[LANG].length){ei++;renderExit()}}
function restartExit(){ei=0;ec=0;renderExit()}


function setFontSize(size){
  document.body.classList.remove("font-small","font-medium","font-large");
  document.body.classList.add("font-"+size);
  document.getElementById("fontS").classList.toggle("active",size==="small");
  document.getElementById("fontM").classList.toggle("active",size==="medium");
  document.getElementById("fontL").classList.toggle("active",size==="large");
  try{localStorage.setItem("year6sa1-font-size",size)}catch(e){}
}
function loadFontSize(){
  let saved="small";
  try{saved=localStorage.getItem("year6sa1-font-size")||"small"}catch(e){}
  setFontSize(saved);
}

loadFontSize();
