<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vital Quest — Science Adventure</title>
<style>
:root{--deep:#062b1a;--green:#0d5c34;--green2:#23874b;--lime:#b9e86d;--paper:#fffef8;--ink:#153321;--gold:#f4c84c;--red:#b8342b}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:linear-gradient(145deg,#052b1a,#0d6137 48%,#07351f);overflow-x:hidden}
body:before{content:"🍃    🌿   🍃      🌱    🍃   🌿     🍃\A   🌿     🍃   🌱     🌿     🍃\A 🍃    🌱      🌿    🍃      🌱";white-space:pre-wrap;position:fixed;inset:-12%;z-index:-2;font-size:56px;line-height:155px;letter-spacing:35px;opacity:.1;animation:float 30s ease-in-out infinite}@keyframes float{50%{transform:translate(5%,5%) rotate(3deg)}}
header{position:sticky;top:0;z-index:30;background:#fffffff3;box-shadow:0 5px 22px #0005}.top{max-width:1180px;margin:auto;padding:9px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.brand{font-size:20px;font-weight:1000;color:var(--deep)}.controls,.hud{display:flex;gap:5px;align-items:center;flex-wrap:wrap}.mini,.pill{border:1px solid #c7dfcc;background:#eef8ed;color:var(--deep);border-radius:11px;padding:8px 10px;font-weight:900}.mini{cursor:pointer}.mini.active{background:var(--deep);color:#fff}
main{max-width:1100px;margin:24px auto;padding:0 15px 50px}.panel{position:relative;background:#fffffff8;border:1px solid #d3e6d6;border-radius:28px;padding:29px;box-shadow:0 17px 42px #0005;overflow:hidden}.panel:after{content:"";position:absolute;width:190px;height:190px;border-radius:50%;background:#b7e56c18;right:-65px;top:-65px;pointer-events:none}
.center{text-align:center}h1{font-size:46px;color:var(--deep);margin:.2em 0}h2{font-size:31px;color:var(--deep)}p{line-height:1.55}.lead{font-size:21px}.hero{font-size:82px;filter:drop-shadow(0 8px 8px #0002);animation:bob 1.8s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-8px)}}
.btn{border:0;border-radius:16px;padding:13px 19px;background:linear-gradient(135deg,#329a56,#0a4b2a);color:#fff;font-size:18px;font-weight:900;cursor:pointer;box-shadow:0 6px 13px #1234;transition:.15s}.btn:hover{transform:translateY(-2px) scale(1.01)}.btn.answer{background:#f4f9f3;color:var(--deep);border:2px solid #c7dfcc;box-shadow:none;min-width:220px}.answers{display:flex;justify-content:center;gap:11px;flex-wrap:wrap;margin:21px 0}
.map{display:grid;grid-template-columns:repeat(5,1fr);gap:11px;margin:24px 0}.level{background:#edf7eb;border:2px solid #c6dfcb;border-radius:20px;padding:14px 8px;text-align:center;min-height:128px;transition:.2s}.level .ico{font-size:41px}.level b{display:block;margin:6px 0}.level.current{border-color:#23874b;box-shadow:0 0 0 5px #a9dc8355;transform:translateY(-4px)}.level.locked{opacity:.43;filter:grayscale(.8)}.level.done{background:#daf1d7;border-color:#67b76b}
.diff{display:inline-block;border-radius:999px;padding:7px 12px;font-weight:900}.easy{background:#dcf2d8;color:#286c33}.medium{background:#fff0b8;color:#795900}.hard{background:#ffded7;color:#972e24}.question{font-size:31px;font-weight:900;text-align:center;margin:24px auto;max-width:850px}.progress{height:13px;background:#dfeae1;border-radius:999px;overflow:hidden;margin:14px 0}.bar{height:100%;background:linear-gradient(90deg,#b4e566,#21864a);transition:.3s}.feedback{text-align:center;min-height:42px;font-size:23px;font-weight:900}.learn{background:#eef8ec;border-left:5px solid #4da85d;border-radius:14px;padding:14px 16px;margin:15px 0;font-size:18px}.hidden{display:none}
.game{background:linear-gradient(145deg,#e9f8e6,#fff);border:2px solid #9bcc9b;border-radius:24px;padding:22px;margin-top:15px}.gameTitle{font-size:27px;font-weight:1000;color:var(--deep)}.scene{font-size:72px;margin:12px}.timer{font-size:30px;font-weight:1000;color:#9b6d00}.clue{background:#fff9d8;border:2px solid #efd271;border-radius:16px;padding:14px;margin:11px auto;max-width:760px;font-size:20px;font-weight:800}.code{display:flex;justify-content:center;gap:10px;margin:20px;flex-wrap:wrap}.digit{width:70px;height:70px;border-radius:16px;background:#092f1d;color:#c9f18d;display:flex;align-items:center;justify-content:center;font-size:35px;font-weight:1000;box-shadow:inset 0 0 0 2px #72a777}.emergency{background:linear-gradient(135deg,#fff1e8,#fff);border-color:#f1a37b}.alarm{animation:alarm .6s infinite alternate}@keyframes alarm{to{transform:scale(1.08);filter:drop-shadow(0 0 14px #e74b3c)}}.who{background:linear-gradient(135deg,#eef5ff,#fff);border-color:#9ebfe3}.lab{background:linear-gradient(135deg,#f1ffe8,#fffbdc);border-color:#a9cf70}.boss{background:linear-gradient(135deg,#fff6cf,#fff);border:2px solid #dfba3e}.stars{font-size:55px}
body.med{font-size:20px}body.big{font-size:27px}body.med .question{font-size:38px}body.big .question{font-size:48px}body.big h1{font-size:64px}
@media(max-width:780px){.map{grid-template-columns:1fr 1fr}.question{font-size:25px}h1{font-size:35px}}
</style></head>
<body>
<header><div class="top"><div class="brand">🌿 VITAL QUEST · SCIENCE ADVENTURE</div><div class="controls">
<button id="en" class="mini active" onclick="setLang('en')">🇬🇧 EN</button><button id="es" class="mini" onclick="setLang('es')">🇪🇸 ES</button>
<button id="a1" class="mini active" onclick="font('small')">A</button><button id="a2" class="mini" onclick="font('med')">A+</button><button id="a3" class="mini" onclick="font('big')">A++</button>
<span class="pill">❤️ <span id="life">3</span></span><span class="pill">⚡ <span id="xp">0</span> XP</span>
</div></div></header><main><div id="app"></div></main>
<script>
let L='en',level=0,q=0,lives=3,xp=0,done=[],locked=false;
const T={
en:{title:"VITAL QUEST: Save the Science Lab!",intro:"Something has gone wrong in the Science Lab. Learn the vital functions, complete special missions and unlock the laboratory. Each level gets harder — because your brain is levelling up too!",start:"BEGIN ADVENTURE",map:"MISSION MAP",enter:"ENTER LEVEL",next:"NEXT CHALLENGE",correct:"✅ Correct! +10 XP",wrong:"❌ Not quite. Learn from the clue!",complete:"LEVEL COMPLETE!",continue:"BACK TO THE MAP",gameover:"MISSION FAILED... FOR NOW!",restart:"TRY AGAIN",win:"LAB UNLOCKED!",levels:["Nutrition Base","Systems HQ","Emergency Zone","Life Lab","Final Boss"],skills:["Remember","Understand","Apply","Explain","Reason"],diff:["EASY · Identify","MEDIUM · Understand","HARD · Apply"],special:"SPECIAL MISSION"},
es:{title:"VITAL QUEST: ¡Salva el Laboratorio!",intro:"Algo ha ocurrido en el Laboratorio de Science. Aprende las funciones vitales, completa misiones especiales y consigue desbloquear el laboratorio. Cada nivel será más difícil... ¡porque tu cerebro también sube de nivel!",start:"EMPEZAR AVENTURA",map:"MAPA DE MISIONES",enter:"ENTRAR AL NIVEL",next:"SIGUIENTE RETO",correct:"✅ ¡Correcto! +10 XP",wrong:"❌ Casi. ¡Aprende con la pista!",complete:"¡NIVEL SUPERADO!",continue:"VOLVER AL MAPA",gameover:"MISIÓN FALLIDA... ¡POR AHORA!",restart:"INTENTAR DE NUEVO",win:"¡LABORATORIO DESBLOQUEADO!",levels:["Base de Nutrición","Central de Aparatos","Zona de Emergencia","Laboratorio de la Vida","Jefe Final"],skills:["Recordar","Comprender","Aplicar","Explicar","Razonar"],diff:["FÁCIL · Identifica","MEDIO · Comprende","DIFÍCIL · Aplica"],special:"MISIÓN ESPECIAL"}};
const Q={
en:[
[["Which vital function provides matter and energy?",["Nutrition","Interaction","Reproduction"],0,"Nutrition allows the body to obtain the nutrients and energy it needs."],["Which system changes food into nutrients?",["Digestive","Circulatory","Nervous"],0,"The digestive system transforms food so nutrients can be absorbed."],["Why are nutrients and oxygen both important?",["Cells use them to obtain energy","They only help us hear","They create sense organs"],0,"Cells need nutrients and oxygen to release the energy required for life."]],
[["Which system takes oxygen from the air?",["Respiratory","Digestive","Excretory"],0,"The respiratory system brings oxygen into the body."],["Why does the circulatory system connect with the digestive and respiratory systems?",["It transports their nutrients and oxygen","It produces both","It controls the senses"],0,"Circulation distributes nutrients from digestion and oxygen from respiration."],["A cell uses oxygen and nutrients and produces waste. Which systems must now cooperate?",["Circulatory and excretory","Only digestive","Only reproductive"],0,"Circulation carries waste away; excretory organs remove it."]],
[["A loud alarm makes you cover your ears. What is the stimulus?",["The loud sound","Covering your ears","Your muscles"],0,"A stimulus is the change detected by the body — here, the loud sound."],["What happens after a sense organ detects a stimulus?",["Information goes to the nervous system","Digestion begins","An egg cell forms"],0,"The nervous system receives and interprets sensory information."],["A ball flies towards your face and you move away. Which sequence best explains it?",["Eyes → nervous system → locomotor system → response","Stomach → lungs → response","Muscles → eyes → digestion"],0,"The eyes detect; the nervous system processes; the locomotor system responds."]],
[["The female reproductive system produces...",["Egg cells","Sperm cells","Oxygen"],0,"The female reproductive system produces egg cells (ova)."],["The male reproductive system produces...",["Sperm cells","Egg cells","Nutrients"],0,"The male reproductive system produces sperm cells."],["Why is reproduction a vital function if one individual can survive without reproducing?",["It ensures continuity of the species","It provides immediate energy","It controls movement"],0,"Reproduction is essential for the survival of the species over time."]],
[["A cyclist eats, breathes faster and sends oxygen and nutrients to working muscles. What does this show?",["Body systems cooperate","Only respiration matters","Systems work separately"],0,"Vital functions depend on cooperation between systems."],["You smell smoke, your brain processes the danger and you run outside. Identify the three main stages.",["Detection → processing → response","Digestion → circulation → reproduction","Movement → stimulus → digestion"],0,"Interaction follows a logical pathway: detect, process and respond."],["FINAL BOSS: Which idea best connects everything learned today?",["Different systems cooperate to carry out the three vital functions","Every system works alone","Vital functions only happen during exercise"],0,"The body works as an integrated whole: systems cooperate to keep us alive."]]] ,
es:[
[["¿Qué función vital proporciona materia y energía?",["Nutrición","Relación","Reproducción"],0,"La nutrición permite obtener los nutrientes y la energía que necesita el cuerpo."],["¿Qué aparato transforma los alimentos en nutrientes?",["Digestivo","Circulatorio","Nervioso"],0,"El aparato digestivo transforma los alimentos para poder absorber sus nutrientes."],["¿Por qué son importantes los nutrientes y el oxígeno?",["Las células los utilizan para obtener energía","Solo sirven para oír","Crean los órganos de los sentidos"],0,"Las células necesitan nutrientes y oxígeno para liberar la energía necesaria para vivir."]],
[["¿Qué aparato toma oxígeno del aire?",["Respiratorio","Digestivo","Excretor"],0,"El aparato respiratorio introduce oxígeno en el cuerpo."],["¿Por qué el circulatorio se relaciona con el digestivo y el respiratorio?",["Transporta sus nutrientes y oxígeno","Los produce","Controla los sentidos"],0,"La circulación distribuye los nutrientes de la digestión y el oxígeno de la respiración."],["Una célula utiliza oxígeno y nutrientes y produce desechos. ¿Qué aparatos deben colaborar ahora?",["Circulatorio y excretor","Solo digestivo","Solo reproductor"],0,"La circulación transporta los desechos y los órganos excretores los eliminan."]],
[["Una alarma fuerte hace que te tapes los oídos. ¿Cuál es el estímulo?",["El sonido fuerte","Taparte los oídos","Tus músculos"],0,"El estímulo es el cambio detectado: en este caso, el sonido fuerte."],["¿Qué ocurre después de que un órgano sensorial detecta un estímulo?",["La información llega al sistema nervioso","Empieza la digestión","Se forma un óvulo"],0,"El sistema nervioso recibe e interpreta la información sensorial."],["Una pelota va hacia tu cara y te apartas. ¿Qué secuencia lo explica mejor?",["Ojos → sistema nervioso → aparato locomotor → respuesta","Estómago → pulmones → respuesta","Músculos → ojos → digestión"],0,"Los ojos detectan, el sistema nervioso procesa y el locomotor responde."]],
[["El aparato reproductor femenino produce...",["Óvulos","Espermatozoides","Oxígeno"],0,"El aparato reproductor femenino produce óvulos."],["El aparato reproductor masculino produce...",["Espermatozoides","Óvulos","Nutrientes"],0,"El aparato reproductor masculino produce espermatozoides."],["¿Por qué la reproducción es una función vital si un individuo puede vivir sin reproducirse?",["Garantiza la continuidad de la especie","Da energía inmediata","Controla el movimiento"],0,"La reproducción es esencial para la supervivencia de la especie a lo largo del tiempo."]],
[["Un ciclista come, respira más rápido y lleva oxígeno y nutrientes a los músculos. ¿Qué demuestra?",["Los aparatos cooperan","Solo importa la respiración","Los aparatos trabajan separados"],0,"Las funciones vitales dependen de la cooperación entre aparatos y sistemas."],["Hueles humo, tu cerebro procesa el peligro y sales corriendo. Identifica las tres etapas.",["Detección → procesamiento → respuesta","Digestión → circulación → reproducción","Movimiento → estímulo → digestión"],0,"La relación sigue un recorrido lógico: detectar, procesar y responder."],["JEFE FINAL: ¿Qué idea conecta mejor todo lo aprendido?",["Los aparatos y sistemas cooperan para realizar las tres funciones vitales","Cada aparato trabaja solo","Las funciones vitales solo ocurren al hacer ejercicio"],0,"El cuerpo funciona como un conjunto integrado para mantenernos vivos."]]]
};
function t(){return T[L]}function hud(){life.textContent=lives;document.getElementById('xp').textContent=xp}
function setLang(x){L=x;en.classList.toggle('active',x==='en');es.classList.toggle('active',x==='es');home()}
function font(x){document.body.classList.remove('med','big');if(x!=='small')document.body.classList.add(x);['a1','a2','a3'].forEach(z=>document.getElementById(z).classList.remove('active'));document.getElementById(x==='small'?'a1':x==='med'?'a2':'a3').classList.add('active')}
function home(){app.innerHTML=`<div class="panel center"><div class="hero">🔬⚡🌿</div><h1>${t().title}</h1><p class="lead">${t().intro}</p><button class="btn" onclick="start()">${t().start} 🚀</button></div>`}
function start(){level=0;q=0;lives=3;xp=0;done=[];hud();map()}
function map(){let icons=["🍎","⚙️","🚨","🧬","👾"];app.innerHTML=`<div class="panel"><h2 class="center">🗺️ ${t().map}</h2><div class="map">${t().levels.map((n,i)=>`<div class="level ${done.includes(i)?'done':i===level?'current':'locked'}"><div class="ico">${icons[i]}</div><b>${i+1}. ${n}</b><small>${done.includes(i)?'✅':i===level?'🔓 '+t().skills[i]:'🔒'}</small></div>`).join('')}</div><div class="center"><button class="btn" onclick="enter()">${level===4?'👾 '+t().levels[4]:t().enter} ➜</button></div></div>`}
function enter(){q=0;renderQ()}
function renderQ(){if(lives<=0)return gameOver();if(q>=3)return afterLevel();locked=false;let d=Q[L][level][q],cls=q===0?'easy':q===1?'medium':'hard';app.innerHTML=`<div class="panel ${level===4?'boss':''}"><span class="diff ${cls}">${t().diff[q]}</span><div class="progress"><div class="bar" style="width:${q/3*100}%"></div></div><div class="question">${d[0]}</div><div id="answers" class="answers"></div><div id="fb" class="feedback"></div><div id="why" class="learn hidden"></div><div class="center"><button id="nxt" class="btn hidden" onclick="nextQ()">${t().next} ➜</button></div></div>`;d[1].map((x,i)=>({text:x,originalIndex:i})).sort(()=>Math.random()-.5).forEach(o=>{let b=document.createElement('button');b.className='btn answer';b.textContent=o.text;b.dataset.originalIndex=o.originalIndex;b.onclick=()=>answer(o.originalIndex);answers.appendChild(b)})}
function answer(i){if(locked)return;locked=true;let d=Q[L][level][q],ok=i===d[2];if(ok){xp+=10;fb.textContent=t().correct;fb.style.color='#16733a'}else{lives--;fb.textContent=t().wrong;fb.style.color='var(--red)'}hud();let correctBtn=[...document.querySelectorAll('.answer')].find(b=>Number(b.dataset.originalIndex)===d[2]);if(correctBtn){correctBtn.style.background='#d9f0d5';correctBtn.style.borderColor='#2b8b4e';}why.textContent='💡 '+d[3];why.classList.remove('hidden');if(lives<=0)setTimeout(gameOver,900);else nxt.classList.remove('hidden')}
function nextQ(){q++;renderQ()}
function afterLevel(){if(level===4)return win();xp+=25;hud();app.innerHTML=`<div class="panel center"><div class="hero">💎</div><h1>${t().complete}</h1><p class="lead">+25 XP ⚡</p><button class="btn" onclick="special()">🎮 ${t().special}</button></div>`}
function special(){if(level===0)return whoAmI();if(level===1)return unlockLab();if(level===2)return emergency();return whoAmIRepro()}
function whoAmI(){let clues=L==='en'?["I work after you eat.","I change food into useful substances.","I transform food into nutrients."]:["Trabajo después de que comes.","Transformo los alimentos en sustancias útiles.","Transformo los alimentos en nutrientes."];whoGame(clues,L==='en'?["Digestive system","Respiratory system","Nervous system"]:["Aparato digestivo","Aparato respiratorio","Sistema nervioso"],0,L==='en'?"WHO AM I?":"¿QUIÉN SOY?")}
function whoAmIRepro(){let clues=L==='en'?["I am a reproductive cell.","I am produced by the female reproductive system.","I am also called an ovum."]:["Soy una célula reproductora.","Me produce el aparato reproductor femenino.","También me llaman óvulo."];whoGame(clues,L==='en'?["Egg cell","Sperm cell","Neuron"]:["Óvulo","Espermatozoide","Neurona"],0,L==='en'?"MYSTERY CELL":"CÉLULA MISTERIOSA")}
function whoGame(clues,opts,ok,title){let shown=1;function draw(){app.innerHTML=`<div class="panel"><div class="game who center"><div class="scene">🕵️‍♀️🔬</div><div class="gameTitle">${title}</div><p>${L==='en'?'Guess with as few clues as possible. Fewer clues = more XP!':'Adivina usando el menor número de pistas. ¡Menos pistas = más XP!'}</p><div id="clues">${clues.slice(0,shown).map((c,i)=>`<div class="clue">🔎 ${i+1}. ${c}</div>`).join('')}</div><div class="answers">${opts.map((o,i)=>({o,i})).sort(()=>Math.random()-.5).map(v=>`<button class="btn answer" onclick="window.guess(${v.i})">${v.o}</button>`).join('')}</div>${shown<3?`<button class="btn" onclick="window.more()">💡 ${L==='en'?'SHOW ANOTHER CLUE':'OTRA PISTA'}</button>`:''}<div id="gfb" class="feedback"></div></div></div>`}window.more=()=>{shown++;draw()};window.guess=(i)=>{if(i===ok){let bonus=shown===1?30:shown===2?20:10;xp+=bonus;hud();missionDone((L==='en'?'Solved with '+shown+' clue(s)!':'¡Resuelto con '+shown+' pista(s)!')+' +'+bonus+' XP')}else{gfb.textContent=L==='en'?'❌ Not that one. Ask for another clue!':'❌ No es ese. ¡Pide otra pista!'}};draw()}
function unlockLab(){let steps=L==='en'?[["Which system gives us oxygen?",["Respiratory","Digestive","Excretory"],0,4],["Which system transports it?",["Circulatory","Nervous","Reproductive"],0,7],["Which system removes cell waste?",["Excretory","Digestive","Locomotor"],0,2]]:[["¿Qué aparato nos aporta oxígeno?",["Respiratorio","Digestivo","Excretor"],0,4],["¿Qué aparato lo transporta?",["Circulatorio","Nervioso","Reproductor"],0,7],["¿Qué aparato elimina desechos celulares?",["Excretor","Digestivo","Locomotor"],0,2]];let s=0,code=[];function draw(){let x=steps[s];app.innerHTML=`<div class="panel"><div class="game lab center"><div class="scene">🔐🧪</div><div class="gameTitle">${L==='en'?'UNLOCK THE LAB':'DESBLOQUEA EL LABORATORIO'}</div><p>${L==='en'?'Solve the science questions to reveal the 3-digit security code.':'Resuelve las preguntas de Science para descubrir el código de seguridad de 3 cifras.'}</p><div class="code">${[0,1,2].map((_,i)=>`<div class="digit">${code[i]??'?'}</div>`).join('')}</div><div class="question">${x[0]}</div><div class="answers">${x[1].map((o,i)=>({o,i})).sort(()=>Math.random()-.5).map(v=>`<button class="btn answer" onclick="window.codePick(${v.i})">${v.o}</button>`).join('')}</div><div id="gfb" class="feedback"></div></div></div>`}window.codePick=i=>{if(i===steps[s][2]){code.push(steps[s][3]);xp+=10;hud();s++;if(s===3){xp+=20;hud();return missionDone((L==='en'?'ACCESS CODE: ':'CÓDIGO DE ACCESO: ')+code.join('')+' 🔓')}draw()}else{gfb.textContent=L==='en'?'🚫 ACCESS DENIED — think again!':'🚫 ACCESO DENEGADO — ¡piensa otra vez!'}};draw()}
function emergency(){let cases=L==='en'?[["🔥 You touch a hot pan!","What detects the stimulus?",["Skin","Stomach","Lungs"],0],["⚽ A ball flies towards your face!","What processes the information?",["Nervous system","Digestive system","Excretory system"],0],["🚨 You hear a fire alarm!","What is the final action called?",["Response","Nutrient","Reproduction"],0]]:[["🔥 ¡Tocas una sartén caliente!","¿Qué detecta el estímulo?",["Piel","Estómago","Pulmones"],0],["⚽ ¡Una pelota va hacia tu cara!","¿Qué procesa la información?",["Sistema nervioso","Aparato digestivo","Aparato excretor"],0],["🚨 ¡Escuchas una alarma de incendios!","¿Cómo se llama la acción final?",["Respuesta","Nutriente","Reproducción"],0]];let c=0;function draw(){let x=cases[c];app.innerHTML=`<div class="panel"><div class="game emergency center"><div class="scene alarm">🚨</div><div class="gameTitle">${L==='en'?'EMERGENCY RESPONSE!':'¡RESPUESTA DE EMERGENCIA!'}</div><div class="clue">${x[0]}</div><div class="question">${x[1]}</div><div class="answers">${x[2].map((o,i)=>({o,i})).sort(()=>Math.random()-.5).map(v=>`<button class="btn answer" onclick="window.emPick(${v.i})">${v.o}</button>`).join('')}</div><div id="gfb" class="feedback"></div></div></div>`}window.emPick=i=>{if(i===cases[c][3]){xp+=15;hud();c++;if(c===cases.length)return missionDone(L==='en'?'All emergencies solved! 🚑 +45 XP':'¡Todas las emergencias resueltas! 🚑 +45 XP');draw()}else{gfb.textContent=L==='en'?'⚠️ Wrong system — try again!':'⚠️ Aparato incorrecto — ¡inténtalo otra vez!'}};draw()}
function missionDone(msg){app.innerHTML=`<div class="panel center"><div class="hero">🏆✨</div><h1>${L==='en'?'SPECIAL MISSION COMPLETE!':'¡MISIÓN ESPECIAL SUPERADA!'}</h1><p class="lead">${msg}</p><button class="btn" onclick="advance()">${t().continue} 🗺️</button></div>`}
function advance(){done.push(level);level++;map()}
function gameOver(){app.innerHTML=`<div class="panel center"><div class="hero">💔</div><h1>${t().gameover}</h1><p class="lead">${L==='en'?'Use what you learned from the clues and beat your previous attempt.':'Usa lo aprendido con las pistas y supera tu intento anterior.'}</p><button class="btn" onclick="start()">${t().restart}</button></div>`}
function win(){xp+=75;hud();app.innerHTML=`<div class="panel boss center"><div class="stars">⭐⭐⭐</div><div class="hero">🏆🔬⚡</div><h1>${t().win}</h1><p class="lead">${L==='en'?'You remembered, understood, applied and reasoned. The Science Lab is safe again!':'Has recordado, comprendido, aplicado y razonado. ¡El Laboratorio de Science vuelve a estar a salvo!'}</p><h2>⚡ ${xp} XP</h2><button class="btn" onclick="start()">${t().restart}</button></div>`}
home();
</script></body></html>
